version: "3.8"

services:
  postgresql:
    image: bitnami/postgresql:latest
    container_name: postgresql
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_PASSWORD: "docker"
      POSTGRESQL_MAX_CONNECTIONS: 100000
    volumes:
      - "postgresql_data:/bitnami/postgresql"

volumes:
  postgresql_data:
